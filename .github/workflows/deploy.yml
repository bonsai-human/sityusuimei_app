name: GitHub Pages へデプロイ

on:
  push:
    branches: [claude/bazi-webapp-planning-ehpq1b, main]
  # 他のブランチの内容を試しに公開したいときは、Actions タブから手動で実行できる
  workflow_dispatch:

# Pages への書き込みに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重なったときは、走っているものを止めずに最新だけを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 計算層が壊れた状態で公開されないよう、デプロイ前に必ず通す
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
